[package]
name = "portable-fido-vault"
version = "0.1.0"
edition = "2021"
description = "可攜式離線 FIDO2 密碼金庫 (portable offline FIDO2 password vault)"

[lib]
name = "portable_fido_vault"
path = "src/lib.rs"

[[example]]
name = "vault_cli"
path = "examples/vault_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

[features]
default = ["mock-fido"]
# mock-fido: 以軟體金鑰（實作 hmac-secret 語義）替代實體 CTAP2，供無硬體環境端到端驗證
mock-fido = []
# real-ctap: 實體 FIDO2 金鑰後端（CTAP2 getInfo/bioEnrollment/makeCredential/getAssertion+hmac-secret）
real-ctap = []

[profile.release]
strip = true
lto = true
