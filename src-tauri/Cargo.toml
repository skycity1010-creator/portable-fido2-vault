[package]
name = "portable-fido-vault"
version = "0.1.0"
edition = "2021"
description = "可攜式離線 FIDO2 密碼金庫 (portable offline FIDO2 password vault)"

[lib]
name = "portable_fido_vault"
path = "src/lib.rs"

[[example]]
name = "vault_cli"
path = "examples/vault_cli.rs"

# 單人版（預設）。明確宣告以免自動探索規則改變時漏掉。
[[bin]]
name = "portable-fido-vault"
path = "src/main.rs"

# 雙群組控管版：只在啟用 dual-control 時編譯（docs/plans/dual-control.md §5）。
[[bin]]
name = "portable-fido-vault-dual"
path = "src/bin/portable-fido-vault-dual.rs"
required-features = ["dual-control"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-dialog = "2"
csv = "1.4"
caseless = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
# 診斷用：vendor authenticator-rs 內建 debug!/info!/warn!（#[macro_use] extern crate log），
# 但 CLI 未安裝 global logger → 全部被 log null logger 丟棄（blocker #2 零可視性的根因）。
# 0.4.34 已在 Cargo.lock（authenticator 的既有依賴）→ 離線可建置。
log = { version = "0.4", features = ["std"] }
# real CTAP2 後端（PM 裁決③核准；v0.6.1 原生支援 PRF + bioEnrollment CBOR 0x09）。
# crypto_rust = 純 Rust 加密路徑（免 NSS/OpenSSL 系統依賴，portable 可攜性）。
# vendored（vendor/authenticator-rs）：離線安全工具不該 build 時連 git；且含一處 Windows
# c_void handle cast 的 vendor patch（Rust 1.98 as_raw_handle 回傳型別差異），見 device.rs。
authenticator = { path = "../vendor/authenticator-rs", optional = true, default-features = false, features = ["crypto_rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["mock-fido"]
# mock-fido: 以軟體金鑰（實作 hmac-secret 語義）替代實體 CTAP2，供無硬體環境端到端驗證
mock-fido = []
# real-ctap: 實體 FIDO2 後端；CLI/診斷用 raw CTAP，Windows GUI 走系統 WebAuthn API
real-ctap = ["dep:authenticator"]
# dual-control: 雙群組（A/B）金鑰控管版；只用於 portable-fido-vault-dual 執行檔
dual-control = []

[profile.release]
strip = true
lto = true
